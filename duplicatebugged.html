<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Loopback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea, #output {
            width: 100%;
            height: 150px;
            margin-top: 10px;
            padding: 10px;
        }
        #output {
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Word Loopback Processor</h2>
    <textarea id="input" placeholder="Enter your text here..."></textarea>
    <button onclick="processText()">Process</button>
    <div id="output"></div>

    <script>
        function processText() {
            let inputText = document.getElementById("input").value;
            let words = inputText.split(/(\b\w+\b|[^\w]+)/);
            let lastSeen = {};
            let outputArray = [];

            words.forEach((word, index) => {
                let lowerWord = word.toLowerCase();
                if (/\w+/.test(word)) { // Check if it's a word
                    if (lastSeen[lowerWord] !== undefined) {
                        let loopStart = lastSeen[lowerWord];
                        outputArray.push(outputArray.slice(loopStart).join(""));
                    } else {
                        outputArray.push(word);
                    }
                    lastSeen[lowerWord] = outputArray.length - 1;
                } else {
                    outputArray.push(word);
                }
            });

            document.getElementById("output").textContent = outputArray.join("");
        }
    </script>
</body>
</html>
